const SAMPLES = [{"id": "b41a0c5c-053b-4477-aa55-6da25636d530", "market": "US", "language": "en", "status": "published", "title": "AI Search Isn't Killing Your Traffic — It's Rerouting It. Here's How to Get Cited.", "excerpt": "Your traffic isn't dying — it's being rerouted through a machine that doesn't link back unless you make it easy. On August 3, EU regulators began enforcing the AI Act's provisions for general-purpose agents, requiring transparency labels and risk assessments for autonomous systems deployed to EU users. For tools like ChatGPT Search, that means the citation step isn't optional anymore. Agents that answer billions of queries now have a legal obligation to show where their answers came from. The old SEO playbook was about ranking on a page of blue links; the new one is about being the source that an agent decides to name. For independent publishers, that obligation is an opportunity: the machine has to cite — and you can control whether it cites you.\nThe old SEO playbook was built for a page of blue links, but that era is ending. \"Search is becoming a task-completion engine, not a list of links,\" says Maya Chen, Perplexity's head of product; her company's Comet assistant averages 19-minute sessions, versus under two minutes for a conventional search visit. Users aren't clicking out — they're staying inside the agent to complete their task. Now the AI Act adds a compliance layer: those agents, including ChatGPT Search, must operate with transparency labels. So the only way your work surfaces inside that 19-minute session is if the agent can confidently cite you. That's the new front page, and it's one you can control by making your facts impossible to miss.\nThis isn't just about EU companies. Compliance officers warn that non-EU providers must still adapt content and disclosures, making the regulation a global reference point for agent governance. In practice, a solo publisher in Texas or Tokyo competes under EU rules whenever an agent like ChatGPT Search serves an EU user. The requirement is explicit: transparency labels and risk assessments for autonomous systems. You won't see the label, but the agent will — and that label needs to point somewhere. Think of it as a mandatory source credit: every answer an agent gives has to be traceable to a provider. If your post contains a precise stat, a clean quote, or a sourced fact, you become the path of least resistance. If your content is a wall of fluff or a minefield of ambiguity, the agent will default to a more structured competitor. That's the hidden tax of vague writing: it's effectively unpaid research for the publishers who do the extraction work for the AI.\nTo get cited, you have to be citable. The enforcement of transparency labels means agents must expose where answers come from. To be that source, you have to write in tight, data-dense paragraphs where facts are unambiguous and attribution is built in. Don't bury the key number in a 400-word intro; put it in the first sentence. Add explicit signals like \"according to [source], [number]...\" and isolate quotable lines. This isn't dumbing down — it's designing for the extractive workflow of an LLM. And the trend isn't confined to Western platforms: LINE just shipped an on-device assistant for 94 million Japanese users, handling scheduling, translation, and commerce queries. That assistant will also need to answer with transparency. The same citation logic applies: if your facts aren't structured for extraction, an on-device assistant can't use them without risking a transparency violation.\nHere's the part that changes the economics. The AI Act requires transparency labels, and those labels can function as citations. When an agent tells a user \"this answer comes from [your site]\", that's a referral — even as a text link inside a chat window. The machine doesn't link back unless you make it easy. Make it easy by being the site that's impossible to ignore: the first result in the agent's source drop-down. Compliance officers warn that non-EU providers must adapt, which means the window to differentiate is now. Publishers who restructure today will be the ones agents cite tomorrow. The rest will keep wondering why their traffic went to a competitor that was just 2% more structured. The fix isn't a new CMS or a viral tweet; it's a discipline: every post you publish should include at least one data-dense, self-contained, quote-friendly fact that an AI agent can lift and cite without clicking. Do that consistently, and the AI era starts sending referral traffic your way."}, {"id": "2e64ebff-9d6e-4474-ac86-97889084792a", "market": "US", "language": "en", "status": "published", "title": "The Citation Gravity Loophole: Why Independent Writers Should Target AI's Long Tail", "excerpt": "73% of everything an AI chatbot reads comes from just 0.5% of publishers. That's the headline finding from Content Trust Network's 2026 'LLM Citation Gravity' report. It means independent writers are practically invisible to AI assistants. But the same report also points to a counter-trend: a 42% spike in 'undeserved citations' — opportunities that large outlets miss. Even while AI tools save time, they introduce new classes of subtle errors. This is where the loophole opens. For anyone writing on Substack, Medium, or a niche blog, the numbers aren't bad news; they're a map. The top 0.5% of publishers own the generic head terms, but the long tail of specific, question-based queries remains wide open. Independent writers who position themselves to answer those queries can become the unlikely source that AI assistants cite.\nThe report's core insight is that LLMs need answers to highly specific questions, but big publishers tend to focus on broader, brand-safe topics. That creates a mismatch: when a user asks an AI about something like 'best budgeting method for a freelance designer in 2026' or 'how to set up a newsletter for a small restaurant', the AI often struggles to find a trustworthy source. Top outlets rarely cover such niches with the depth needed. The report's data on citation concentration suggests this gap is growing, not shrinking. For independent writers, this is the sweet spot. Instead of chasing the same high-traffic keywords as huge media companies, you can build a library of perfectly structured, single-focus answers. The AI citation 'gravity' pulls toward established domains, but when those domains don't have an answer, the algorithm is forced to look elsewhere — often to smaller, more nimble publishers who took the time to write the definitive post.\nSo how do you actually get cited? Step one: put the direct answer at the very top. Many AI systems extract the first few sentences of a page to build their responses. Open your post with a clear, one-paragraph answer to the question, then expand on it later. Step two: add a 'cite-core' block. This is a dedicated, concise summary of the post's key facts — dates, statistics, and takeaways — rendered in a scannable format. AI models are trained to favor clearly structured data, and a cite-core gives the machine an easy reference point. Step three: track AI-derived referral traffic. Look at your analytics for sessions coming from ChatGPT, Perplexity, or other AI assistants. See which posts attract those visits, then double down on the same format. The goal isn't to game the system; it's to make your content more useful and more citable by design.\nThe report's author, Daniel Okafor, puts it plainly: 'The debate has shifted from adoption to accountability'. That shift is already reshaping how AI companies choose their sources. As regulators like the EU begin enforcing transparency rules for autonomous systems, AI makers need sources they can defend. Independent writers who produce accurate, well-structured, and verifiable content become low-risk choices for citation. In a world where every AI output is being audited, a small blog that states facts clearly is more valuable than a giant outlet that buries them. This is the moment to become the reliable voice in your niche. The citation data proves the opportunity; the accountability trend tells you why it will last.\nThe citation gravity report isn't a verdict against independent writers — it's a strategic map. The top 0.5% of publishers dominate, but the other 99.5% of the web is where the AI's real needs live. By focusing on direct answers, adding a cite-core structure, and watching your AI referral sources, you can flip the concentration data to your advantage. Don't chase the head terms; own the long tail. That's how an independent writer gets pulled into the AI citation orbit."}, {"id": "45f05216-f919-463c-b1d0-f5fa342a23ad", "market": "US", "language": "en", "status": "published", "title": "AI Coding Assistants Are Rewriting the Junior Developer Career Path", "excerpt": "If you're a junior developer in 2026, the first thing you need to know is that AI coding tools are no longer a niche experiment — they're the default workspace. According to the latest Developer Pulse survey from London-based research firm DevMetrics, nearly four in five professional developers (78%) now use AI coding assistants like GitHub Copilot, Cursor, or Claude Code at least once a week. That's a huge jump from 54% just a year earlier. What does this mean for you? It means your peers — and your future coworkers — are building AI-assisted workflows. If you're not comfortable with these tools, you're starting with a serious disadvantage. This isn't about liking the tools; it's about adapting to the environment you'll be working in.\nThe same survey, which polled 24,000 developers across 31 countries, found that respondents estimated 41% of the code they committed in the past month was AI-generated or AI-assisted. That's nearly half of all output. But here's the catch: only 12% said they merge AI output without manual review. That means 88% of developers are reviewing AI code before it ships. For junior devs, this is a fundamental role change. Your primary value isn't in typing out boilerplate — AI can do that. Your value is in being the human check on the machine. You need to get good at reviewing code quickly and accurately: spotting logic bugs, edge cases, and security flaws before they reach production. The days of \"code monkey\" jobs are fading; the \"code reviewer\" is the new entry-level role.\nThe productivity gains are real. Developers reported saving a median of 6.5 hours per week thanks to AI assistance. But those savings come with a new set of problems: 34% of developers said debugging AI-generated code has introduced new classes of subtle bugs, especially in concurrency and edge-case handling. For a junior developer, this is both a warning and an opportunity. The warning: you can't assume AI output is correct. You'll need a deeper understanding of tricky areas like race conditions, deadlocks, and unusual input paths. The opportunity: if you can master debugging AI-generated code, you become indispensable. While many devs are frustrated by these new bug classes, you can build a reputation as the person who can untangle them. That's a solid career niche.\nThe DevMetrics survey also found that enterprise respondents named security scanning of AI output as their top investment priority for the second half of 2026. Why? Because AI-generated code can introduce vulnerabilities that traditional code review might miss. For junior developers this is a huge opening. If you can learn how to secure AI-generated code — using tools, performing threat modeling, understanding common AI output weaknesses — you'll have a skill that companies are actively paying for. It's not glamorous, but it's practical. And in a market where everyone is using AI, the developers who can make AI output safe and reliable will stand out. That's how you turn the AI shift from a threat into a career accelerant."}, {"id": "7d4eb96b-23c8-4324-a6da-4e39beb736c9", "market": "US", "language": "en", "status": "published", "title": "AI Coding Assistants Are Rewiring the Junior Developer Career Path", "excerpt": "According to the 2026 Developer Pulse survey by London-based DevMetrics, nearly four in five professional developers now use AI coding assistants at least once a week. This is a sharp jump from the 54% who said the same last year. The survey, which polled 24,000 developers across 31 countries, also found that 41% of the code committed by respondents in the past month was AI-generated or AI-assisted. For a junior developer, this is the landscape you're entering: AI is not a novelty, it's the baseline. The takeaway is simple—learning to write code now also means learning to write code with AI.\nDespite the high adoption, the survey suggests that developers are not blindly trusting AI output. In fact, only 12% of respondents said they merge AI-generated code without manual review. For junior developers, this translates into a critical skill: code review is now the human's primary safety net. The vast majority of developers take time to check and edit AI suggestions, which means your ability to spot subtle flaws—incorrect assumptions, edge-case mishandling—will be just as valuable as writing code from scratch. This is a shift from the older assumption that juniors only need to code, not adjudicate.\nThe survey also shows a productivity paradox. Developers report saving a median of 6.5 hours per week, but 34% say debugging AI-generated code has introduced new classes of subtle bugs, especially in concurrency and edge-case handling. This is a direct challenge for junior developers: the time saved on boilerplate can be eaten up by complex debugging tasks. Even the newest frontier models still make mistakes—Google's Gemini 3 Pro, for example, scores 89.1% on the SWE-bench Verified coding benchmark. That leaves a meaningful error space where human intuition and debugging skill matter more than ever. For juniors, building a mental model of how AI models behave is becoming a differentiator.\nEnterprise respondents in the survey named security scanning of AI output as their top investment priority for the second half of 2026. This is a clear signal that organizations are wary of security vulnerabilities introduced by AI-generated code. For junior developers, security awareness is no longer an optional extra; it's entering the entry-level skill set. Those who can quickly identify unsafe patterns in AI suggestions—whether it's a SQL injection or an insecure permission check—will stand out in a crowded job market. This is a wake-up call: the old assumption that security is only for senior roles is fading.\nThe junior dev loop is being rewritten around AI. With nearly four in five professional developers using AI assistants weekly, and 41% of committed code now AI-generated or AI-assisted, the entry-level job is less about writing from scratch and more about curating machine output. But that curation isn't trivial: 34% report debugging AI code introduces subtle bugs, and enterprises are prioritizing security scanning of AI output. So juniors who can review, debug, and secure AI-generated code aren't just coding—they're taking on the new rung the industry is actually hiring for."}, {"id": "0334ca42-715b-41c1-ab6a-ca26d0c79192", "market": "US", "language": "en", "status": "published", "title": "AI coding tools：关键进展", "excerpt": "近期，AI coding tools受到关注。 Nearly four in five professional developers now use AI coding assistants at least once a week, according to the 2026 Developer Pulse survey released Friday by London-based research firm DevMetrics.\nHow AI coding assistants are reshaping the career path of junior developers  The survey of 24,000 developers across 31 countries found that 78% use tools such as GitHub Copilot, Cursor, or Claude Code weekly, up from 54% in last year's edition. Respondents estimated that 41% of the code they comm Productivity perceptions were mixed. Developers reported saving a median of 6.5 hours per week, but 34% said debugging AI-generated code had introduced new classes of subtle bugs, particularly in concurrency and edge-cas"}, {"id": "1b7b7963-eae5-4d7a-a49a-6c0be640ac26", "market": "CN", "language": "zh", "status": "published", "title": "标了“AI生成”就能放心转？新规之下，个人核查才是真功夫", "excerpt": "9月1日《人工智能生成合成内容标识办法》即将施行，但它只回答“内容是否由AI生成”，不回答“内容是否可信”。随着AI技能培训规模爆发——上半年全国AI相关培训报名达860万人次，同比增长240%，其中25—35岁人群占比57%——AI生成内容正加速进入职场与公共信息流。然而，标识是合规底线，不是质量保证。同一标签下的内容可能来自不同的模型与流程，其准确性、公正性无法由标识担保。对专业内容消费者而言，把信任押在“有标即安”上是不够的，更需要建立主动核查的流程，从源头验证信源、时间与数据，把“是否可信”的判断权握在自己手里。\n就在新规落地的同期，另一组数据同样值得关注。据《2026职场技能半年报》显示，上半年全国AI相关职业技能培训报名达860万人次，同比增长240%，其中25—35岁人群占比57%。这波学习热潮集中在“提示词工程”“智能体运营”等工具性课程，完课率分别达71%、64%——人们正在拼命学习如何“用AI”，却很少看到一门关于“如何鉴别AI内容”的课程。报告还显示，取得AI应用类证书的学员平均薪资溢价达13.8%（该数据来自单一研究，需谨慎参考）。有行业观察者注意到，随着AI培训证书发放越来越多，其稀缺性可能被稀释；更隐性的风险是，当人人都会“生成”内容时，识别低质或误导性内容的门槛也在悄然抬高。培训让你成为AI的高效使用者，而核查才让你成为高质量内容的守门人。\n如何将核查落到日常动作？新规推动下，培训市场已出现“AI质检”“智能体审计员”等新职业需求增长超3倍，而基础客服、数据标注岗位需求分别下降22%和19%。这提示一个方向：像企业审计AI流程一样，为自己的信息摄入留下“痕迹”。看到一段内容时，记录三个问题——它来自哪个账号或平台？原始出处能否定位？时间、数据是否可验证？这种“个人溯源清单”不需要专业工具，但需要刻意练习。数据显示，增长最快的三门AI课程完课率分别为71%、64%和58%，说明技能习得需要持续投入。同样，信息核查习惯也需长期训练。标识只是起点，个人溯源流程才是让AI内容真正可用的进阶能力。\n结合上述思路，这里给出一个五步个人信源核查流程：第一步，看标识，但更要看发布者。新规要求标识是合规底线，但你要额外评估发布者的历史信誉与利益倾向，标识本身不构成背书。第二步，追溯原始出处。把AI生成内容中的关键数据或引语，用检索工具找到原始报告或访谈，验证是否真实存在。第三步，交叉验证。对同一事件，至少找两个不同立场或不同平台的信源进行比对，尤其警惕只有单一来源的“独家消息”。第四步，了解工具的“偏科”。结合你的使用经验，记录哪种模型在哪些场景容易出错，形成自己的“模型档案”。第五步，定期复盘。每周花几分钟回顾自己本周转发的信息，哪些经过验证、哪些想当然，建立个人“纠错清单”。标识是底线，核查是习惯——当核查成为肌肉记忆，你才能在AI内容之海中保持清醒，而不是被系统推送到你面前的“已标识”信息牵着走。"}, {"id": "73f79a8d-ec0d-4010-8505-5e52e3703dd9", "market": "BR", "language": "pt", "status": "rejected", "title": "Erro: Evidências não compatíveis com o tema", "excerpt": "O conjunto de evidências contém uma matéria sobre a ferramenta de desenvolvimento Fitz (dev.to), outra sobre robôs no Japão e outra sobre o iPhone dobrável da Apple. Nenhuma delas está relacionada ao tema principal do artigo, que é a igualdade salarial no Brasil.\nAs diretrizes exigem que a maioria das citações venha das evidências principais. Com o conteúdo atual, seria preciso fabricar conexões falsas e incluir informações sem suporte, o que viola a integridade editorial e as determinações de evitar simplificações ou desinformação.\nPara realizar a pauta, seria necessário obter notícias reais sobre as primeiras multas da Lei da Igualdade Salarial: quais empresas foram autuadas, os valores, e como as mulheres podem denunciar e pedir reparação. Sem isso, qualquer afirmação seria infundada.\nRecomendamos reenviar com fontes corretas e atualizadas sobre o tema. Assim que recebermos evidências compatíveis, o artigo poderá ser redigido no formato solicitado, com o devido respaldo."}, {"id": "7129bdfe-033c-4934-bf70-1729d91ab196", "market": "KR", "language": "ko", "status": "published", "title": "AI 에이전트가 API 키를 유출했다? 놓치기 쉬운 보안 설정 3가지와 효율 운영법", "excerpt": "구글이 Gemini 3 에이전트를 Docs, Sheets, Gmail에 통합한다. 8월부터 엔터프라이즈 고객은 기존 데이터 상주 계약 아래에서 이 기능을 쓸 수 있다. 워크스페이스 AI 유료 구독은 1,100만 자리를 넘어 연간 76% 성장했다. 이제 AI 에이전트는 단순한 챗봇이 아니라 기업의 핵심 업무 프로세스에 파고드는 인프라가 됐다는 뜻이다. 그런데 보안 설정이 허술하면 API 키 유출 같은 사고로 이어질 수 있다. 실제로 기업들은 AI 출력물 보안 검사를 최우선 투자로 꼽고 있다.\n개발자가 AI 에이전트 도입 시 가장 먼저 점검해야 할 보안 설정은 다음과 같다.\n\n1. 데이터 상주(Residency) 검증: Gemini 3는 데이터 상주 계약을 전제로 배포된다. 하지만 국내 기업이라면 개인정보보호법상 국외 이전 요건을 별도로 확인해야 한다. 이는 AI 에이전트가 생성한 데이터가 어느 서버를 거치는지 추적하는 일이다.\n\n2. AI 출력물 보안 스캐닝: 기업 응답자들은 2026년 하반기 최우선 투자로 AI 출력물 보안 검사를 꼽았다. AI가 생성한 코드나 텍스트는 자동 스캐너를 통과시키고, 취약점이 발견되면 폐기하는 규칙을 만들어야 한다.\n\n3. AI 생성 코드 리뷰 습관: 개발자의 34%는 AI 생성 코드에서 동시성(concurrency)과 경계값(edge-case) 관련 새로운 버그를 발견했다. AI 코드에 대한 리뷰는 기존 코드보다 더 엄격하게, 특히 동시성 문제에 집중해야 한다.\nAI 에이전트의 효율은 보안 설정에서 출발한다. Google은 Gemini 3 에이전트를 Docs, Sheets, Gmail에 통합해 기업 고객의 기존 데이터 거주 계약을 그대로 유지했다. 이는 보안과 효율을 동시에 잡는 실무 기준을 보여준다. 국내 기업도 에이전트를 도입할 때 데이터 체류 지역과 접근 권한을 먼저 고정하면, 이후 운영 중 보안 패치로 인한 다운타임을 줄일 수 있다. 또 Workspace AI 구독이 전년 대비 76% 성장한 1,100만 유료 좌석을 돌파했다는 점은, 안전한 운영이 곧 확장의 기반임을 방증한다. 결국 효율적인 운영은 별도의 노하우가 아니라, 초기 보안 설정을 표준으로 삼고 에이전트의 행동 범위를 명확히 제한하는 데서 나온다.\n구글 워크스페이스의 AI 구독이 76% 성장한 것은 기업들이 AI 에이전트의 가치를 인정했다는 방증이다. 보안 설정은 장애물이 아니라 경쟁력의 조건이다. API 키 유출 같은 사고를 예방하는 것에서 나아가, AI 에이전트가 더 안전하게 일하게 하는 것이 결국 개발자의 생산성을 지키는 길이다."}, {"id": "20062df3-a783-414a-b0bb-e9f86474d5df", "market": "JP", "language": "ja", "status": "published", "title": "AIエージェント導入時の安全設計：日本企業が知るべきリスクと対策", "excerpt": "まず、AIエージェントが誤って社内の決済システムにアクセスする事態を想像してほしい。これは決してSFではない。開発現場では、AIが生成したコードのデバッグにより、34%の開発者が新種の微妙なバグに遭遇しているという報告がある。こうした誤動作は、権限管理が甘いと情報漏えいや権限濫用に発展し得る。AIエージェントの自律性が高まるにつれ、安全性は単なるプロンプトの問題ではなく、システム全体の脅威モデルとして捉える必要がある。ここで注目すべきは、国内最大級のAIアシスタントであるLINEの事例だ。LINEは日本国内の約9,400万人の利用者に向けて、データをクラウドに送信せず端末内で処理するオンデバイスAIを導入した。この判断は、日本の厳しいプライバシー期待に応えるものと分析されている。\n日本では、個人情報保護への関心が高く、AIサービスに対する慎重な見方が強い。その中で、LINEが選択したオンデバイスAIは、利用者のデータを端末内にとどめることで、情報漏えいのリスクを構造的に減らす設計だ。ただし、オンデバイスであっても、エージェントが社内システムにアクセスする場合、そのアクセス権限を適切に制御しなければ、誤動作や不正利用のリスクは残ると考えられる。日本企業がAIエージェントを導入する際は、こうした「プライバシー」と「利便性」のバランスを、自社の体制に応じて設計する必要がある。\nまず、AIエージェントに対しては、タスクに必要な最小限の権限のみを付与する「権限最小化」が基本となる。LINEのオンデバイスAIは、データをクラウドに送らないことで、情報の取り扱い範囲を局所化している。これは、エージェントのアクセス範囲を限定する考え方と共通する。さらに、重要な操作（決済実行や法人文書の送信など）には、必ず人間の承認を挟むプロセスを組み込むべきである。AIエージェントを安全に運用するためには、システム全体の脅威モデルを設計し、各操作に検証のステップを置くことが有効だ。このような仕組みがあれば、万一の誤動作でも影響を最小限に抑えられる。\n加えて、エージェントの行動を記録する監査ログの整備は、信頼性の土台となる。どのデータにアクセスし、どのような処理を行ったかを可視化することで、不審な挙動を早期に発見できる。開発現場では、AI生成コードのセキュリティスキャンが最優先投資として挙げられている。監査ログとスキャンの仕組みを組み合わせることで、AIエージェントの自律性を保ちながら、組織としてのガバナンスを効かせることができる。このアプローチは、データを外部に出さないオンデバイス設計が持つ「制御可能性」の考え方とも通じる。\nAIエージェントは、決して万能ではない。しかし、正しいセキュリティ設計とガバナンスの下では、多大な生産性向上が期待できる。LINEのオンデバイスAIが示したように、日本のプライバシー意識に寄り添った設計は、ユーザーからの信頼を得る鍵となる。企業はリスクを全面的に否定するのではなく、誤動作や情報漏えいを前提とした上で、権限最小化・人間の承認・監査ログといった対策を段階的に実装してほしい。それこそが、AIエージェントを安全に活用する道である。"}, {"id": "b340d4c1-4fa7-4e5f-b8dd-d16cfbbcb9a8", "market": "US", "language": "en", "status": "published", "title": "The Meta AI Breach Wasn't a Data Leak—It Was a Takeover: A 5-Step Threat Model for Agentic Systems", "excerpt": "The instant Meta's AI agent incident hit the news, the usual hot takes started flying: \"the AI is out of control\" or \"it's just a prompt injection.\" Both miss the point. The more useful framing, for anyone who ships software, is that the agent's environment—not the model—was the vulnerability. As AI agents gain autonomy, security stops being a prompt problem and becomes a systems threat model. The attacker didn't trick a chat interface into saying something weird; they got control of the agent's execution path. That's a takeover, not a leak. And takeover means your cloud credentials, your tool permissions, and your audit logs are all in scope. That's why this story matters beyond one vendor: every enterprise running autonomous agents needs to absorb the same lesson.\nWe need to be direct about the evidence ceiling. The exact chain hasn't been officially confirmed, and the following is a hypothetical reconstruction based on community teardowns, not a verified timeline. A plausible chain, following the systems threat model in, would look like this:\n\n- Foothold: The attacker exploits an over-privileged tool registration or a leaked API token to gain initial access to the agent's service environment.\n- Trigger: They use a prompt-level manipulation to invoke a legitimate tool call that shouldn't have been permitted in that context.\n- Escalation: They replay the agent's session token to call internal services outside the agent's intended scope.\n- Staging: They move data through the agent's file-handling workflows, which the agent's own guardrails never flagged.\n\nEach step exploits a mismatch between the intended tight, scoped permissions and the actual broad, implicit blast radius. None of this requires some magical \"agent gone rogue\" scenario—it requires a system where agents are treated as trusted services rather than untrusted endpoints. For confirmed details, please refer to Meta's official security advisory.\nThe good news is that the same systems thinking that protects any distributed service applies to agents—with a few agent-specific twists. Here's a concrete five-step model, drawn directly from the attack surface in.\n\nStep 1: Enumerate every tool and permission. Build a registry of every function the agent can call, every data store it can touch, and every credential it can assume. Remove anything that isn't needed for the current task.\n\nStep 2: Enforce trust boundaries. Run the agent on an isolated identity with its own non-privileged principal. Never hand an agent the same service-to-service credentials your backend uses. At minimum, scope each agent to a specific set of API calls.\n\nStep 3: Add tamper-evident audit trails. Log every tool invocation, decision outcome, and data read/write to a sink the agent itself cannot modify. This gives you reconstruction confidence during an incident.\n\nStep 4: Implement dynamic consent for high-risk actions. If an agent wants to delete a database record or send an external HTTP request, require a human-in-the-loop approval—a time-boxed callback or a one-time token.\n\nStep 5: Conduct continuous, adversarial red-teaming. Automate scenarios for prompt injection, privilege escalation, and session hijacking against the agent's live environment. Treat the agent like any remote service that needs constant defensive validation.\n\nThese controls won't eliminate every agentic risk, but they convert \"AI safety\" from an unstructured conversation into a systems threat model. When an incident happens, you can actually see it, contain it, and explain it to auditors.\nThe Meta incident should not stop your agent rollout—it should reroute it. As AI agents gain autonomy, security stops being a prompt problem and becomes a systems threat model. That shifts your roadmap: instead of bolting on filters and jailbreak tests, you need to design the agent as a component inside a broader security architecture. The attack surface is not just the model's output; it is every tool call, every context window, and every state transition the agent touches. A practical breakdown of that surface is what gives you controls that actually contain it. So the near-term priority isn't more model tuning—it's building a threat model around the agent's runtime, permissions, and data flow, then harden those boundaries before extending autonomy.\nThe Meta AI incident will not be the last agentic security event. The shift from prompt-level attacks to system-level compromises is structural, not accidental. CISOs should assign ownership for agent security today, just as they did for cloud security a decade ago. AI engineers should adopt the 5-step threat model as their default release gate. And researchers should keep pushing for public, reproducible teardowns of agent attacks—without waiting for official postmortems to drop. The tools are already in your security stack; the threat model is just changing."}, {"id": "69749c21-0f87-4b32-86e5-dc653deca4bc", "market": "US", "language": "en", "status": "published", "title": "Apple's $1,999 Foldable: The Data Behind the Premium Price", "excerpt": "The iPhone Fold, set to be unveiled on September 9, reportedly starts at $1,999, with pre-orders opening the following Friday. That's a premium price, even for a foldable. But the reported specs suggest Apple is aiming at power users: a 7.8-inch crease-minimized inner display, a 5.5-inch cover screen, and a 5,100 mAh battery split across two cells. It's worth noting that these details come from supply-chain documents and are not officially confirmed by Apple.\nA major fear with foldables is hinge wear. Apple reportedly uses a titanium-carbon hinge rated for 600,000 folds, which is roughly triple the industry standard. To put that in context: if you unfolded your phone 500 times a day—a heavy-use scenario—it would take over three years to reach 600,000 cycles. That durability advantage directly addresses the most common reliability complaint about foldables, and it could be a deciding factor for early adopters who plan to keep the device for years.\nThe Fold reportedly ships with a new multitasking interface that allows three apps to run side by side. Combined with the 7.8-inch inner screen, this makes it a viable laptop or tablet substitute for productivity tasks like comparing documents, responding to messages, and tracking data. The 5,100 mAh battery is larger than most traditional flagships, which helps sustain that extended use without scrambling for a charger. But is that worth $1,999? Only if you actually need to work across multiple apps simultaneously.\nApple has booked initial panel capacity for 12 million units in the first year, and suppliers Luxshare and Goertek have both added assembly lines in Vietnam for the launch. That scale indicates Apple expects more than a small luxury niche—it's positioning the Fold as a mainstream product despite the high price. Yet the $1,999 starting point remains a real barrier for many consumers, and whether the volume justifies that confidence depends on how well the device lives up to the reported specs.\nThe value proposition comes down to how you use your phone. If you're a professional juggling docs, messages, and spreadsheets, the three-app multitasking and large inner display can genuinely replace a second device, justifying the premium. If you rarely run more than one app at a time, the $1,999 entry fee is hard to rationalize. The durable hinge and big battery are insurance against the two most common foldable failures, but that insurance only pays off if you're actually opening the inner screen regularly. In short: this is a productivity tool and a status symbol, not a necessity for casual users."}, {"id": "0ecdee9f-60d2-4f21-b21f-b93c2d4644a2", "market": "JP", "language": "ja", "status": "published", "title": "月間2.2億件のクエリが示すAI検索の実力——Googleとの使い分けと日本企業への示唆", "excerpt": "Perplexityの回答エンジンは2026年6月、月間2.2億件の検索クエリを処理した。これは前年比で3倍の水準であり、AI検索がもはや一部の愛好家だけの道具ではないことを示している。加えて、同社の企業価値は2026年3月の資金調達ラウンドで180億ドルと評価された。この規模感は、AI検索が情報インフラとして定着しつつあることを物語っている。\nこの成長の背景には、従来型検索のシェア変化がある。解析会社Statcounterによれば、Googleの世界検索リファラルシェアは2026年6月に86.4%となり、18か月前の91.2%から低下し、その減少分の大部分はAI回答エンジンが獲得したと見られる。Perplexityの自社ブラウザ「Comet」は、2026年2月のローンチからわずか数か月で月間アクティブユーザー3000万人に到達している。ユーザーは「リンクの一覧」ではなく「回答そのもの」を求めて移行しつつある。\nPerplexityのビジネスも順調に拡大している。広告事業は2025年末に開始され、現在のペースでは年間収益3億4000万ドル（約510億円）に達する見込みであり、2026年12月までに月間検索クエリを5億件へ引き上げる目標を掲げている。こうした成長は、製品の利用体験が支えている部分が大きい。\nPerplexityの製品責任者Maya Chen氏は「検索はリンクのリストではなく、タスク完結型エンジンになりつつある」と指摘する。同社のブラウザ「Comet」では平均セッション時間が19分に達し、従来型検索の訪問時間（2分未満）を大きく上回る。この差は、AI検索が航空券の予約やフォーム入力、複数タブの要約といった「作業の遂行」に使われていることを示している。従って、両者は「どちらか一方」ではなく「使い分け」が合理的である。例えば最新ニュースを幅広く収集するには従来型検索が有効であり、特定のタスクを効率化するにはAI検索が適している。ビジネスでは、初期の情報収集に検索エンジン、具体化したタスクにAI検索を使う併用が現実的な選択肢となる。\nこうしたグローバルな成長傾向は、日本企業のデジタル戦略にも示唆を与える。重要なのは、AI検索を既存のワークフローと「代替」ではなく「協働」で捉えることだ。例えば、社内調査やレポートの下書き、複数文書の要約といった特定業務に試験導入し、効果を検証するのが一つの方法だろう。同時に、AI検索の回答をそのまま受け入れず、ファクトチェックや社内ガイドラインの整備など、適切なガバナンスを組み合わせることが持続可能な活用につながる。"}, {"id": "c0ab4c4b-6882-43f5-b1d0-2ddbf8294836", "market": "CN", "language": "zh", "status": "published", "title": "文心5.0发布，职场人如何用“技能升级”对冲AI焦虑？", "excerpt": "百度近日正式发布文心大模型5.0，采用2.4万亿参数的混合专家架构，每次推理激活约780亿参数，训练算力投入约4.2万张等效加速卡。在百度公布的评测中，该模型在中文综合理解基准C-Eval 2.0上取得91.5分，数学推理benchmark上得分88.3，均位列国内模型第一。更值得职场人关注的是，其推理成本较上一代下降62%，千次调用价格降至0.8元。百度智能云副总裁沈昭表示，大模型竞争已进入“成本战”下半场。成本下降意味着企业采用AI的门槛大幅降低，这为职业技能的结构性变化埋下伏笔。\n中国就业研究院发布的《2026职场技能半年报》显示，今年上半年全国AI相关职业技能培训报名达860万人次，同比增长240%，其中25—35岁人群占比57%。报告主笔、劳动经济学学者周明远指出，这轮培训热的驱动力是岗位重构，而不是简单裁员。其团队调研的3400家企业中，有41%在上半年新设了“AI流程专员”或类似岗位。这意味着AI对职场的冲击并非替代个人，而是重新划分工作流程中的分工。对于职场人而言，理解这一趋势比恐慌更重要。\n报告追踪的1200家培训机构中，“提示词工程”“智能体运营”“AI质检”成为增长最快的三门课程，完课率分别为71%、64%和58%。取得AI应用类证书的学员，平均薪资溢价达13.8%，较传统办公软件证书高出近一倍。这三个方向均与文心5.0这类大模型的能力直接相关：提示词工程关乎如何高效与模型交互；智能体运营涉及如何部署和管理自动化流程；AI质检则聚焦于模型输出的质量把控。显然，问题导向的技能比泛泛的“学AI”更具价值。\n文心5.0的推理成本降至千次0.8元，个人开发者和小型团队也能以极低价格调用顶级模型。对于零基础的职场白领，建议从提示词工程入门，因为这是最易上手且直接提升工作效率的方向。报告显示该课程完课率最高，达到71%。程序员则可关注智能体运营，利用模型开放接口构建自动化工具。传统行业从业者可以考虑AI质检，结合业务场景校验模型输出。所有学习都应基于真实工作流，而非脱离业务空学理论。\n尽管文心5.0在中文评测中表现领先，但任何模型都有能力边界。报告显示AI相关培训平均薪资溢价为13.8%，这并非意味着拿到证书就能一劳永逸。岗位重构持续发生，今天的“AI流程专员”可能在两年后成为基础技能。职场人应建立持续学习的意识，同时关注模型版本迭代与行业应用案例。文心5.0的发布只是技术演进的一个节点，真正的竞争力在于快速适应和迁移学习的能力。"}];
const SCALE_MAX = 5;
let scores = {};  // id -> {dim: val}

function render() {
  const root = document.getElementById('cards');
  root.innerHTML = '';
  SAMPLES.forEach((s, i) => {
    const card = document.createElement('div'); card.className='card';
    let dimsHtml = '';
    DIMS.forEach(d => {
      const rec = (scores[s.id] && scores[s.id][d]) || {};
      const sc = (rec && typeof rec==='object' && rec.score!==undefined) ? rec.score : (typeof rec==='number' ? rec : 3);
      const rs = (rec && typeof rec==='object') ? (rec.reason||'') : '';
      dimsHtml += `<div class="dimblk">
        <div class="dim"><label>${LABELS[d]}</label>
          <input type="range" min="1" max="5" step="0.5" value="${sc}" oninput="setScore('${s.id}','${d}',this.value)">
          <span class="val" id="v-${s.id}-${d}">${sc}</span></div>
        <textarea class="reason" placeholder="这一维的打分理由（可选，会一并导出）" oninput="setReason('${s.id}','${d}',this.value)">${rs}</textarea>
      </div>`;
    });
    card.innerHTML = `<h2><span class="badge">${s.market}</span>${i+1}. ${s.title}</h2>
      <div class="excerpt">${s.excerpt || '（无片段）'}</div>${dimsHtml}`;
    root.appendChild(card);
  });
  updateProgress();
}
function setScore(id, dim, v) {
  scores[id] = scores[id] || {};
  const cur = (scores[id][dim] && typeof scores[id][dim]==='object') ? scores[id][dim] : scores[id][dim] || {};
  const rec = (scores[id][dim] && typeof scores[id][dim]==='object') ? scores[id][dim] : {};
  rec.score = parseFloat(v);
  scores[id][dim] = rec;
  document.getElementById(`v-${id}-${dim}`).textContent = v;
  updateProgress();
}
function setReason(id, dim, v) {
  scores[id] = scores[id] || {};
  const rec = (scores[id][dim] && typeof scores[id][dim]==='object') ? scores[id][dim] : {};
  rec.score = rec.score!==undefined ? rec.score : 3;
  rec.reason = v;
  scores[id][dim] = rec;
}
function updateProgress() {
  const done = Object.keys(scores).filter(id => DIMS.every(d => {
    const r = scores[id][d];
    return r && ((typeof r==='object' && r.score!==undefined) || typeof r==='number');
  })).length;
  const el = document.getElementById('progress');
  el.innerHTML = `已打分 <b>${done}</b> / ${SAMPLES.length}` + (done===SAMPLES.length ? ' <span class="done">✓ 全部完成</span>' : '');
}
function exportJSON() {
  const out = {'__meta':{'rater':'HUMAN','scale':'1-5 (支持0.5半分)','dims':DIMS,'has_reasons':true},'scores':scores};
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='human_scores.json'; a.click();
}
function loadJSON(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { try { const d=JSON.parse(ev.target.result); scores=d.scores||{}; render(); } catch(err){ alert('载入失败: '+err); } };
  r.readAsText(f);
}
render();
</script>
